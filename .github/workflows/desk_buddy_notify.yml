name: Desk Buddy Notification

on:
  push:
    branches: ["**"]
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify on push
        if: github.event_name == 'push' && github.event.head_commit != null
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          REPO_NAME: ${{ github.event.repository.name }}
          DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          MESSAGE=$(echo "$COMMIT_MSG" | head -1 | cut -c1-50)
          PAYLOAD=$(jq -cn \
            --arg type "commit" \
            --arg message "$MESSAGE" \
            --arg author "$COMMIT_AUTHOR" \
            --arg repo "$REPO_NAME" \
            --argjson ts "$(date +%s)" \
            '{type:$type,message:$message,author:$author,repo:$repo,timestamp:$ts}')
          curl -s -X PUT \
            "https://desk-buddy-007-default-rtdb.asia-southeast1.firebasedatabase.app/notifications/latest.json?auth=${DB_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          echo "Notified: commit — $MESSAGE"

      - name: Notify on PR merged
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_NAME: ${{ github.event.repository.name }}
          DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          TITLE=$(echo "$PR_TITLE" | cut -c1-50)
          PAYLOAD=$(jq -cn \
            --arg type "pr_merged" \
            --arg message "$TITLE" \
            --arg author "$PR_AUTHOR" \
            --arg repo "$REPO_NAME" \
            --argjson ts "$(date +%s)" \
            '{type:$type,message:$message,author:$author,repo:$repo,timestamp:$ts}')
          curl -s -X PUT \
            "https://desk-buddy-007-default-rtdb.asia-southeast1.firebasedatabase.app/notifications/latest.json?auth=${DB_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          echo "Notified: PR merged — $TITLE"

      - name: Notify on PR approved
        if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          REVIEWER: ${{ github.event.review.user.login }}
          REPO_NAME: ${{ github.event.repository.name }}
          DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          TITLE=$(echo "$PR_TITLE" | cut -c1-50)
          PAYLOAD=$(jq -cn \
            --arg type "pr_approved" \
            --arg message "$TITLE" \
            --arg author "$REVIEWER" \
            --arg repo "$REPO_NAME" \
            --argjson ts "$(date +%s)" \
            '{type:$type,message:$message,author:$author,repo:$repo,timestamp:$ts}')
          curl -s -X PUT \
            "https://desk-buddy-007-default-rtdb.asia-southeast1.firebasedatabase.app/notifications/latest.json?auth=${DB_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          echo "Notified: PR approved — $TITLE by $REVIEWER"

      - name: Notify on PR comment
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          REPO_NAME: ${{ github.event.repository.name }}
          DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          SNIPPET=$(echo "$COMMENT_BODY" | head -1 | cut -c1-50)
          PAYLOAD=$(jq -cn \
            --arg type "pr_comment" \
            --arg message "$SNIPPET" \
            --arg author "$COMMENTER" \
            --arg repo "$REPO_NAME" \
            --argjson ts "$(date +%s)" \
            '{type:$type,message:$message,author:$author,repo:$repo,timestamp:$ts}')
          curl -s -X PUT \
            "https://desk-buddy-007-default-rtdb.asia-southeast1.firebasedatabase.app/notifications/latest.json?auth=${DB_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          echo "Notified: PR comment by $COMMENTER"
